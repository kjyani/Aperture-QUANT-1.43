    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                     (window.Window && Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch'));
          if (!desc || !desc.set || !desc.writable) {
            var activeFetch = origFetch ? origFetch.bind(window) : null;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // Fallback if environment restricts property definition
        }
      })();
    </script>
